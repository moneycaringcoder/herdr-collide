name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      # The git layer shells out to real git, and the fixtures create real
      # commits, so git needs an identity on the runner.
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "collide ci"
          git config --global init.defaultBranch main
          git --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all --locked

      - name: Release build
        run: cargo build --release --locked

  msrv:
    name: minimum Rust 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install minimum Rust
        run: rustup toolchain install 1.80.0 --profile minimal

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: msrv

      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "collide ci"
          git config --global init.defaultBranch main

      - name: Test minimum Rust
        run: cargo +1.80.0 test --all --locked
