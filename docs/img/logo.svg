<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="collide">
  <title>collide</title>
  <!--
    Several worktrees of one repository. Translucent fills rather than outlines
    alone, so each overlap darkens where two checkouts meet and darkens again
    where all three do — the picture is the pairwise comparison itself. The mark
    sits in the region every one of them is touching.

    Mid-tone colours on purpose: one file that reads on light and dark.
  -->
  <g fill="#8b949e" fill-opacity="0.22" stroke="#8b949e" stroke-width="3.5" stroke-linejoin="round">
    <rect x="12" y="12" width="58" height="58" rx="8"/>
    <rect x="50" y="12" width="58" height="58" rx="8"/>
    <rect x="31" y="48" width="58" height="58" rx="8"/>
  </g>
  <g stroke="#ff8080" stroke-width="6" stroke-linecap="round">
    <line x1="53" y1="51" x2="67" y2="67"/>
    <line x1="67" y1="51" x2="53" y2="67"/>
  </g>
</svg>
