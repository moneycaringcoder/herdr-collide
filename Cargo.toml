[package]
name = "collide"
version = "0.1.0"
edition = "2021"
description = "Warns when two agents in different git worktrees of one repo are about to collide."
license = "MIT"
repository = "https://github.com/moneycaringcoder/herdr-collide"

# The binary target inherits the package name => target/release/collide, which
# is what every command in herdr-plugin.toml points at.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unix-only: setsid for daemon detachment, and SIGINT/SIGTERM shutdown plumbing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
