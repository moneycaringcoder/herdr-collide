[package]
name = "collide"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Warns when agents in different git worktrees of one repo are about to collide."
license = "MIT"
repository = "https://github.com/moneycaringcoder/herdr-collide"

# The binary target inherits the package name => target/release/collide, which
# is what every command in herdr-plugin.toml points at.

[dependencies]
crook = { git = "https://github.com/moneycaringcoder/herdr-crook", rev = "b3b154053be085f0aa343cd3eeeb903d5982ad0a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Terminal column widths and grapheme-safe truncation. Both are pure Rust and
# keep the pane's no-wrap contract aligned with maintained Unicode tables.
unicode-width = "0.2"
unicode-segmentation = "1"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }

# Unix-only: setsid for daemon detachment, and SIGINT/SIGTERM shutdown plumbing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bench]]
name = "gather_cost"
harness = false
